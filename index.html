<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="むめーの自己紹介サイト的な？">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cherry Bomb One', 'M PLUS Rounded 1c', 'Yu Gothic', sans-serif;
            background: black;
            overflow: hidden;
            cursor: pointer;
        }

        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            opacity: 0.6;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .entry-text {
            color: white;
            font-size: 2.5rem;
            font-weight: 300;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .profile-container {
            background: rgba(30, 30, 40, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            width: 600px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 0;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .avatar-decoration {
            position: absolute;
            top: -11.5px;
            left: -11.5px;
            width: 143px;
            height: 143px;
            pointer-events: none;
            transition: transform 0.3s ease;
        }

        .avatar-wrap:hover .profile-image {
            transform: scale(1.05);
        }

        .avatar-wrap:hover .avatar-decoration {
            transform: scale(1.05);
        }

        .profile-name {
            color: #5ba3ff;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(91, 163, 255, 0.5);
            letter-spacing: 1px;
        }

        .profile-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 2px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: auto;
        }

        .social-icon {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .github { background: #333; }
        .youtube { background: #333; }
        .website { background: #666; }
        .discord { background: #5865F2; }

        .social-icon:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: snowfall 8s infinite linear;
        }

        @keyframes snowfall {
            0% { 
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: snowdrift 12s infinite linear;
        }

        @keyframes snowdrift {
            0% { 
                transform: translateY(-100vh) translateX(0px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <video id="video-background" loop playsinline webkit-playsinline>
        <source src="movie.mp4" type="video/mp4">
    </video>
    
    <div class="overlay"></div>
    <div class="stars" id="stars"></div>
    <div class="floating-particles" id="particles"></div>
    
    <div id="entry-screen" class="entry-screen">
        <div class="entry-text">click or press enter</div>
    </div>
    
    <div id="main-content" class="main-content">
        <div class="profile-container fade-in">
            <div class="avatar-wrap">
                <img src="profile-image.png?v=5" alt="mumeidayo" class="profile-image">
                <img src="avatar-decoration.png?v=6" alt="" class="avatar-decoration" aria-hidden="true">
            </div>
            <h1 class="profile-name">mumeidayo</h1>
            <p class="profile-subtitle">discord @ltrw</p>
            
            <div class="social-icons">
                <a href="https://github.com/mume-dayo" class="social-icon github" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">

                    </svg>
                </a>
                <a href="https://discord.gg/z2mTrXxQ" class="social-icon discord" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M20.317 4.369A19.79 19.79 0 0 0 15.885 3c-.214.385-.463.902-.636 1.31a18.27 18.27 0 0 0-5.498 0c-.173-.408-.422-.925-.637-1.31A19.74 19.74 0 0 0 4.677 4.37C1.82 8.54 1.04 12.62 1.41 16.65a19.9 19.9 0 0 0 6.073 3.078c.49-.672.927-1.38 1.303-2.126-.714-.272-1.399-.61-2.04-1.004.171-.125.338-.255.5-.39 3.937 1.85 8.21 1.85 12.068 0 .163.135.33.265.5.39-.642.394-1.327.732-2.04 1.004.376.746.813 1.454 1.303 2.126a19.84 19.84 0 0 0 6.073-3.078c.42-4.73-.722-8.79-3.58-12.281zM8.02 14.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.094 2.157 2.42 0 1.334-.955 2.419-2.157 2.419zm7.96 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.094 2.157 2.42 0 1.334-.946 2.419-2.157 2.419z"/>
                    </svg>
                </a>
                <a href="https://mumei.lol" class="social-icon website" target="_blank">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>


    <script>
        const entryScreen = document.getElementById('entry-screen');
        const mainContent = document.getElementById('main-content');
        const backgroundMusic = document.getElementById('video-background');
        const starsContainer = document.getElementById('stars');
        const particlesContainer = document.getElementById('particles');
        let hasEntered = false;

        function createStars() {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = '-10px';
                star.style.width = (Math.random() * 4 + 2) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 8 + 's';
                star.style.animationDuration = (Math.random() * 3 + 6) + 's';
                starsContainer.appendChild(star);
            }
        }

        function createParticles() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = '-10px';
                particle.style.width = (Math.random() * 6 + 3) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }


        function enterSite() {
            if (hasEntered) return;
            hasEntered = true;
            
            backgroundMusic.muted = false;
            backgroundMusic.volume = 0.2;
            backgroundMusic.currentTime = 0;
            const playPromise = backgroundMusic.play();
            if (playPromise) {
                playPromise.catch(e => console.log('音声の再生がブロックされました:', e));
            }

            entryScreen.style.opacity = '0';
            entryScreen.style.transition = 'opacity 1.5s ease-out';
            
            setTimeout(() => {
                entryScreen.classList.add('hidden');
                mainContent.style.display = 'flex';
            }, 1500);
        }

        document.addEventListener('click', enterSite);
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.code === 'Enter') {
                enterSite();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            createStars();
            createParticles();
            backgroundMusic.volume = 0.2;
        });

        (function setupDecoration() {
            var deco = document.querySelector('.avatar-decoration');
            if (!deco) return;
            var params = new URLSearchParams(location.search);
            var v = params.get('deco') || params.get('decoration');
            if (!v && location.hash) {
                var m = location.hash.match(/(?:^|[#&])(?:deco|decoration)=([^&]+)/);
                if (m) v = decodeURIComponent(m[1]);
            }
            if (!v) v = localStorage.getItem('decoUrl');
            if (v) {
                deco.src = v;
                localStorage.setItem('decoUrl', v);
            }
        })();
    </script>
</body>
